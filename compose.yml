name: wiki-uprzejmiedonosze

networks:
  edge:
    external: true   # owned by the sibling `edge` project - must already be up on this host
                      # (docker network ls | grep edge) before `docker compose up` here

volumes:
  wiki-data:   # data/ - pages, media, search index, logs. Seeded from the image's
               # baked-in tracked content on first boot only (see docker/entrypoint.sh).
               # Only used when WIKI_DATA_SOURCE (below) is unset - on a host
               # where the bare-metal wiki's data/ already lives on the same
               # machine, WIKI_DATA_SOURCE instead bind-mounts it directly
               # (see that host's own .env), so this named volume just
               # never gets created/used there.
  wiki-conf:   # conf/ - mainly acl.auth.php, hand-edited at runtime via the ACL
               # Manager plugin, so it can't just live in the image. Same first-boot
               # seeding as wiki-data. conf/local-prod.php is regenerated on every
               # boot from env vars regardless (see entrypoint.sh) - it's a secret,
               # never baked into the image or committed to the repo.
               # Only used when WIKI_CONF_SOURCE (below) is unset - see
               # WIKI_DATA_SOURCE's comment above, same reasoning applies
               # (this one caught live: users.auth.php is untracked in git
               # entirely, so a fresh named volume seeded from the image
               # never had it at all - every login failed with "user
               # authentication is currently impossible" until this was
               # bind-mounted to the real bare-metal conf/, which also had
               # config drift beyond that one file, e.g. plugins.local.php
               # disabling authad/authldap/authmysql/authpgsql to avoid
               # clashing with authud - worth keeping in sync).

services:
  wiki:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    networks:
      - edge
    volumes:
      # WIKI_DATA_SOURCE lets one host override the data/ source to a real
      # bind-mount path instead of the default named volume - prod
      # (uprzejmiedonosze.net) points this at /opt/wiki/data, the same
      # path this container has always used, so real page content is
      # visible immediately with no named-volume migration step.
      # WIKI_DATA_RO was only ever needed during the original
      # bare-metal-to-Docker migration on the old host (getdreamestate.com),
      # where a separate bare-metal PHP-FPM process (host uid 33, Debian)
      # still owned those files and was still the live site - that
      # migration is done and this container is the sole owner of
      # /opt/wiki/data now (its own www-data, uid 82), so WIKI_DATA_RO is
      # unset here.
      - ${WIKI_DATA_SOURCE:-wiki-data}:/var/www/html/data${WIKI_DATA_RO:+:ro}
      - ${WIKI_CONF_SOURCE:-wiki-conf}:/var/www/html/conf
    environment:
      AUTHUD_ENDPOINT: ${AUTHUD_ENDPOINT:?Set AUTHUD_ENDPOINT in .env}
      AUTHUD_APIKEY: ${AUTHUD_APIKEY:?Set AUTHUD_APIKEY in .env}
      WIKI_SUPERUSER: ${WIKI_SUPERUSER:-@admin}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/wiki/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      traefik.enable: "true"
      traefik.docker.network: edge
      traefik.http.routers.wiki.rule: Host(`${WIKI_DOMAIN:?Set WIKI_DOMAIN in .env}`) && PathPrefix(`/wiki`)
      traefik.http.routers.wiki.entrypoints: websecure
      traefik.http.routers.wiki.tls.certresolver: letsencrypt
      # WIKI_DOMAIN is uprzejmiedonosze.net now (this container shares the
      # host with the ../uprzejmiedonosze webapp project) - Traefik's
      # default priority is rule length, and `ud-prod`'s rule
      # (Host(uprzejmiedonosze.net) || Host(www.uprzejmiedonosze.net)) is
      # longer than this one, so without an explicit priority the webapp's
      # router would win the whole domain and this one would never match.
      traefik.http.routers.wiki.priority: "1000"
      traefik.http.services.wiki.loadbalancer.server.port: "80"
